<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration status — Agile AI Systems</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#059669;--accent-light:#10b981;--indigo:#4338ca;--text:#f8fafc;--text-muted:#94a3b8;--border-strong:rgba(148,163,184,0.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f172a,#1e1b4b 50%,#064e3b);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;text-align:center}
.card{max-width:480px;background:linear-gradient(145deg,rgba(30,41,59,0.6),rgba(15,23,42,0.8));border:1px solid var(--border-strong);border-radius:20px;padding:2.5rem}
.check{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--indigo));display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 1.5rem}
h1{font-size:1.6rem;font-weight:800;margin-bottom:.6rem}
p{color:var(--text-muted);font-size:.95rem;line-height:1.6;margin-bottom:1rem}
.btn{display:inline-block;margin-top:1rem;padding:.9rem 2rem;font-weight:700;border-radius:11px;text-decoration:none;background:linear-gradient(135deg,var(--accent),var(--indigo));color:#fff}
.muted{font-size:.82rem;color:#64748b;margin-top:1.5rem}
.muted a{color:var(--accent-light);overflow-wrap:anywhere}
a:focus-visible{outline:2px solid var(--accent-light);outline-offset:4px}
</style>
</head>
<body>
<div class="card">
  <div class="check" id="status-icon" aria-hidden="true">…</div>
  <h1 id="title">Registration status</h1>
  <p id="body" role="status" aria-live="polite">We cannot confirm your registration from this page alone. If you completed checkout, check your email or contact us for help.</p>
  <a class="btn" href="https://support-smartsolns.com/login">Go to login →</a>
  <p class="muted">Need help? <a href="https://wa.me/96551757072?text=Hello%20Agile%20AI%20Systems%2C%20I%20need%20help%20checking%20my%20registration%20status." target="_blank" rel="noopener noreferrer">Contact us on WhatsApp</a>, <a href="tel:+96551757072">call +965 5175 7072</a>, or email <a href="mailto:info@agileaisystems.com?subject=Registration%20help">info@agileaisystems.com</a>.</p>
  <p class="muted"><a href="index.html">← Back to website</a> · <a href="index.html#contact">Request a free demo</a></p>
</div>
<script>
// Only confirm provisioning after the existing service returns that status.
const API='https://support-smartsolns.com/api/signup';
const sid=new URLSearchParams(location.search).get('signup_id');
if(sid){
  const title=document.getElementById('title');
  const body=document.getElementById('body');
  body.textContent='Checking your account setup status…';
  let tries=0;
  async function poll(){
    tries++;
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),10000);
    try{
      const r=await fetch(API+'/status?signup_id='+encodeURIComponent(sid),{signal:controller.signal});
      if(!r.ok) throw new Error('Status unavailable');
      const d=await r.json();
      if(!d || d.error || typeof d.status!=='string') throw new Error('Status unavailable');
      if(d.status==='provisioned'){
        title.textContent='Your account is ready';
        document.getElementById('status-icon').textContent='✓';
        body.textContent='Your account'+(d.tenant_code?' ('+d.tenant_code+')':'')+' is ready. Check your email for login details.';
        return;
      }
      body.textContent='Your account setup has not been confirmed yet. We are checking again shortly.';
      if(tries<20) setTimeout(poll,3000);
      else body.textContent='We could not confirm account setup yet. Check your email or contact us before trying to pay again.';
    }catch(e){
      body.textContent='We could not check your registration status. Check your email or contact us before trying to pay again.';
    }finally{
      clearTimeout(timeout);
    }
  }
  poll();
}
</script>
</body>
</html>
